name: test

# Manual only: widget and JVM tests can't run in the phone sandbox this
# project is developed in, so they run here on demand.
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      # proot built from Termux's source at the commit pinned in fetch_deps.sh.
      - uses: actions/cache@v4
        with:
          path: build/proot-*
          key: proot-${{ hashFiles('scripts/fetch_deps.sh') }}

      - run: flutter test --reporter expanded
      - name: Kotlin unit tests
        run: |
          bash scripts/fetch_deps.sh
          flutter build apk --config-only
          cd android && ./gradlew --no-daemon :app:testDebugUnitTest
