name: Fine-tune Needle

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        default: "3"
      per_tool:
        description: Generated examples per action
        default: "120"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HF_REV: 93e88ede867e4311c39151285e74df513e4b835b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/finetune.yml

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-needle3-${{ env.HF_REV }}

      - run: pip install "cactus-needle[train]==3.0.2"

      - run: python training/generate.py --out train.jsonl --per-tool ${{ inputs.per_tool }}

      - name: Train LoRA adapter
        run: needle finetune train.jsonl --epochs ${{ inputs.epochs }} --max-len 640 --out adapter.safetensors

      - name: Export models
        run: |
          needle build --lora adapter.safetensors --out tuned.cact
          needle build --lora adapter.safetensors --layers 12 --out tuned-12.cact

      - name: Evaluate base vs tuned
        run: |
          HF=https://huggingface.co/Cactus-Compute/needle3/resolve/$HF_REV
          curl -fsSL $HF/linux-x86_64/needle -o needle && chmod +x needle
          curl -fsSL $HF/needle3.cact -o base.cact
          for m in base.cact tuned.cact tuned-12.cact; do
            for s in dev holdout; do
              python training/eval.py --needle ./needle --model $m --cases training/$s.tsv | tee -a report.txt
            done
          done
          ls -la *.cact | tee -a report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: needle-tuned
          path: |
            tuned.cact
            tuned-12.cact
            adapter.safetensors
            report.txt
            train.jsonl
