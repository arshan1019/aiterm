name: screenshots

# Manual: renders the main screens to PNGs for layout review.
on: workflow_dispatch

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - run: flutter test --update-goldens test_screens/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test_screens/shots/
          retention-days: 3
